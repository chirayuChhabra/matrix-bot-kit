[package]
name = "matrix-bot-node"
version = "0.1.0"
edition.workspace = true
license.workspace = true

[lib]
crate-type = ["cdylib"]

[dependencies]
matrix-bot-core = { path = "../matrix-bot-core" }
matrix-bot-runtime = { path = "../matrix-bot-runtime" }
matrix-sdk = { version = "0.14", features = ["e2e-encryption", "markdown", "sqlite", "rustls-tls"], default-features = false }
napi = { version = "3.8", default-features = false, features = ["async", "napi8"] }
napi-derive = "3.5"
tokio = { version = "1.48", features = ["rt-multi-thread", "time"] }

[build-dependencies]
napi-build = "2.3"
