[package]
name = "matrix-bot-runtime"
version = "0.1.0"
edition.workspace = true
license.workspace = true

[dependencies]
matrix-bot-core = { path = "../matrix-bot-core" }
libsqlite3-sys = { version = "0.35", features = ["bundled"] }
matrix-sdk = { version = "0.14", features = ["e2e-encryption", "markdown", "sqlite", "rustls-tls"], default-features = false }
mime = "0.3"
serde_json = "1.0"
tokio = { version = "1.48", features = ["fs"] }
url = "2.5"
