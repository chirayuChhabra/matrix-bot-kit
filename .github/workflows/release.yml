name: Release
env:
  DEBUG: napi:*
  APP_NAME: matrix-bot-kit
  MACOSX_DEPLOYMENT_TARGET: '10.13'

on:
  push:
    tags:
      - 'v[0-9]*'

permissions:
  contents: read
  id-token: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        settings:
          - host: macos-latest
            target: x86_64-apple-darwin
            build: cd js && bun run build-native --target x86_64-apple-darwin
          - host: macos-latest
            target: aarch64-apple-darwin
            build: cd js && bun run build-native --target aarch64-apple-darwin
          - host: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            build: cd js && bun run build-native --target x86_64-unknown-linux-gnu
          - host: ubuntu-latest
            target: aarch64-unknown-linux-gnu
            setup: sudo apt-get update -y && sudo apt-get install -y gcc-aarch64-linux-gnu
            build: cd js && CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_LINKER=aarch64-linux-gnu-gcc bun run build-native --target aarch64-unknown-linux-gnu
          - host: windows-latest
            target: x86_64-pc-windows-msvc
            build: cd js && bun run build-native --target x86_64-pc-windows-msvc
          - host: windows-latest
            target: aarch64-pc-windows-msvc
            build: cd js && bun run build-native --target aarch64-pc-windows-msvc

    name: stable - ${{ matrix.settings.target }}
    runs-on: ${{ matrix.settings.host }}
    
    steps:
      - uses: actions/checkout@v4

      - name: Setup node
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Install Bun
        uses: oven-sh/setup-bun@v2

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable
          targets: ${{ matrix.settings.target }}

      - name: Install dependencies
        run: bun install

      - name: Setup cross-compilation
        if: ${{ matrix.settings.setup }}
        run: ${{ matrix.settings.setup }}

      - name: Build
        run: ${{ matrix.settings.build }}

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: bindings-${{ matrix.settings.target }}
          path: js/*.node
          if-no-files-found: error

  test:
    name: Test and Typecheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup node
        uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Install Bun
        uses: oven-sh/setup-bun@v2
      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable
      - name: Install dependencies
        run: bun install
      - name: Typecheck
        run: cd js && bun run typecheck
      - name: JS SDK Tests
        run: cd js && bun test tests native-tests
      - name: Build JS
        run: cd js && bun run build
      - name: Smoke test CLI
        run: node js/dist/cli.js --version
      - name: Root E2E Tests
        run: bun test tests
      - name: Rust Core Tests
        run: cargo test --workspace

  publish:
    name: Publish
    runs-on: ubuntu-latest
    needs:
      - build
      - test
    steps:
      - uses: actions/checkout@v4

      - name: Setup node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: 'https://registry.npmjs.org'

      - name: Install Bun
        uses: oven-sh/setup-bun@v2

      - name: Install dependencies
        run: bun install

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Move artifacts
        run: cd js && bunx @napi-rs/cli artifacts -d ../artifacts

      - name: List packages
        run: ls -laR js/npm/

      - name: Build TypeScript
        run: cd js && bun run build

      - name: Copy README
        run: cp README.md js/

      - name: Sync versions
        run: cd js && bun run prepublishOnly

      - name: Publish platform packages
        run: |
          TAG_ARG=""
          if [[ "${{ github.ref_name }}" == *"alpha-exp"* ]]; then
            TAG_ARG="--tag alpha-exp"
          fi
          for dir in js/npm/*/; do
            if [ -f "$dir/package.json" ]; then
              echo "Publishing $dir..."
              (cd "$dir" && npm publish --access public --provenance $TAG_ARG)
            fi
          done
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Publish main package
        run: |
          TAG_ARG=""
          if [[ "${{ github.ref_name }}" == *"alpha-exp"* ]]; then
            TAG_ARG="--tag alpha-exp"
          fi
          cd js
          npm publish --access public --provenance $TAG_ARG
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
